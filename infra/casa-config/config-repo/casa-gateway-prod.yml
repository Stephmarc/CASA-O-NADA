server:
  port: 18080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/casa
          # jwk-set-uri: http://localhost:8085/.well-known/jwks.json
          
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: casa-clientes
              uri: lb://casa-cliente-ms
              predicates:
                - Path=/api/v1/clientes/**,/api/v1/documentos/**
            - id: casa-propiedad-tipos-propiedad
              uri: lb://casa-propiedad-ms
              predicates:
                - Path=/api/v1/tipos-propiedad/**
            - id: casa-propiedad-propiedades
              uri: lb://casa-propiedad-ms
              predicates:
                - Path=/api/v1/propiedades/**
            - id: casa-reserva-reservas
              uri: lb://casa-reserva-ms
              predicates:
                - Path=/api/v1/reservas/**
            - id: casa-pago-consulta
              uri: lb://casa-pago-ms
              predicates:
                - Path=/api/v1/pagos/**

            - id: casa-auth-login
              uri: lb://casa-auth-ms
              predicates:
                - Path=/api/v1/auth/**

#      globalcors:
#        cors-configurations:
#          '[/**]':
#            allowedOrigins: "http://localhost:4200"
#            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
#            allowedHeaders: "*"
#            allowCredentials: true

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

casa:
  cors:
    allowed-origins: http://localhost:4200
