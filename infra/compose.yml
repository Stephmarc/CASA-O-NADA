name: casa-infra-prod

services:
  casa-config:
    build:
      context: ./casa-config
      dockerfile: Dockerfile
    container_name: casa-config
    restart: unless-stopped
    ports:
      - "28888:8888"
    volumes:
      - ./casa-config/config-repo:/config-repo
    environment:
      SERVER_PORT: 8888
      SPRING_PROFILES_ACTIVE: native
      CONFIG_REPO_LOCATION: file:/config-repo
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - casa-prod-net

  casa-eureka:
    build:
      context: ./casa-eureka
      dockerfile: Dockerfile
    container_name: casa-eureka
    restart: unless-stopped
    ports:
      - "28761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://casa-config:8888
    depends_on:
      casa-config:
        condition: service_healthy
    networks:
      - casa-prod-net

networks:
  casa-prod-net:
    name: casa-prod-net
