global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "casa-microservicios"
    eureka_sd_configs:
      - server: "http://casa-eureka:8761/eureka"
    metrics_path: "/actuator/prometheus"
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application

  - job_name: "casa-config"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["casa-config:8888"]
        labels:
          application: casa-config

  - job_name: "casa-eureka"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["casa-eureka:8761"]
        labels:
          application: casa-eureka
