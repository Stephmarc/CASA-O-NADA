groups:
  - name: casa
    rules:
      - alert: ServicioCaido
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Servicio sin respuesta"}
      - alert: ErroresHTTP
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.05
        for: 1m
        labels: {severity: warning}
