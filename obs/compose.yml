name: casa-obs-prod

services:
  casa-prometheus:
    image: prom/prometheus:v3.14.0
    container_name: casa-prometheus
    restart: unless-stopped
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - casa-prod-net

  casa-loki:
    image: grafana/loki:3.7.6
    container_name: casa-loki
    restart: unless-stopped
    ports:
      - "23100:3100"
    networks:
      - casa-prod-net

  casa-promtail:
    image: grafana/promtail:3.6.8
    container_name: casa-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../services/casa-propiedad-ms/logs:/var/log/casa-propiedad-ms:ro
      - ../services/casa-reserva-ms/logs:/var/log/casa-reserva-ms:ro
      - ../services/casa-auth-ms/logs:/var/log/casa-auth-ms:ro
      - ../services/casa-pago-ms/logs:/var/log/casa-pago-ms:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - casa-loki
    networks:
      - casa-prod-net

networks:
  casa-prod-net:
    external: true
