name: casa-pago-dev

services:
  postgres-pago-dev:
    image: postgres:16-alpine
    container_name: casa-postgres-pago-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: casa_pago_db
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
    ports:
      - "15435:5432"
    volumes:
      - casa_pago_dev_data:/var/lib/postgresql/data

volumes:
  casa_pago_dev_data:
