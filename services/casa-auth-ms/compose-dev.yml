name: casa-auth-dev

services:
  postgres-auth-dev:
    image: postgres:16-alpine
    container_name: casa-postgres-auth-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: casa_auth_db
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
    ports:
      - "15431:5432"
    volumes:
      - casa_auth_dev_data:/var/lib/postgresql/data

volumes:
  casa_auth_dev_data: