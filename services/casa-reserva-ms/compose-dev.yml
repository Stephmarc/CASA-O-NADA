name: casa-reserva-dev

services:
  postgres-reserva-dev:
    image: postgres:16-alpine
    container_name: casa-postgres-reserva-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: casa_reserva_db
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
    ports:
      - "15434:5432"
    volumes:
      - casa_reserva_dev_data:/var/lib/postgresql/data

volumes:
  casa_reserva_dev_data:
