name: casa-kafka-prod

services:
  casa-kafka:
    image: apache/kafka:4.3.1
    container_name: casa-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://casa-kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@casa-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - casa-prod-net

  casa-kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: casa-kafka-ui
    restart: unless-stopped
    ports:
      - "28085:8080"
    depends_on:
      - casa-kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: casa-prod
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: casa-kafka:9092
    networks:
      - casa-prod-net

networks:
  casa-prod-net:
    external: true
    name: casa-prod-net
